name: Node.js CI

on:
  push:
    branches: ['master', 'dev']
  pull_request:
    branches: ['master', 'dev']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra sự tồn tại của package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ package-lock.json không tồn tại. Tạo lại..."
            npm install --package-lock-only
            git add package-lock.json
            git commit -m "Tự động thêm package-lock.json"
            git push origin $(git rev-parse --abbrev-ref HEAD)
          else
            echo "✅ package-lock.json đã tồn tại."
          fi

      - name: Sử dụng Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present
      # - run: npm test
